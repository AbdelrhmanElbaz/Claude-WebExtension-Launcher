name: Build Launcher

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:   # يسمح لك تشغّله يدويًا من تبويب Actions بضغطة زر

permissions:
  contents: write   # عشان يقدر يرفع الملفات كـ artifact / release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # لو عندك MinGW/CGO مطلوب لـ Fyne على ويندوز
      - name: Install MinGW (CGO dependency for Fyne)
        run: choco install mingw -y

      - name: Download Go modules
        run: go mod tidy

      - name: Build (Windows)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          .\build-windows.ps1

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            *.exe
            build/**
            dist/**
          if-no-files-found: warn

  build-macos:
    runs-on: macos-14   # macOS 14 = Apple Silicon (arm64) runner
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download Go modules
        run: go mod tidy

      - name: Build (macOS arm64)
        run: |
          chmod +x build-macos-arm64.sh
          ./build-macos-arm64.sh

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: |
            *.app
            build/**
            dist/**
          if-no-files-found: warn
